stages:
  - build

build_ccs_static_data:
  stage: build
  image: debian:trixie
  before_script:
    - apt update -qq
    - DEBIAN_FRONTEND=noninteractive apt install -y --no-install-recommends make perl libdigest-crc-perl libyaml-tiny-perl git-core
  script:
    - make clean
    - make
  artifacts:
    paths:
      - output/*.bin
    when: always
    expire_in: 1 week
