sensor-read-only-regs:
# the sensor ROM reports CCS 0.7; the CCS driver needs 1.1 semantics
  - mipi_ccs_version			v1_1
# the sensor ROM reports a PLL capability the CCS driver cannot use; override
# with the single PLL + external divider tree the sensor actually implements
  - clock_tree_pll_capability		6
# ROM reports min_line_length_pck 5544 and min_frame_blanking_lines 14: full
# resolution saturates the ADC below 6008 and loses the bottom rows below 36.
# min_line_length_pck_bin must stay above min_line_length_pck / 2, otherwise
# the PLL calculator drops the binned pixel rate by half (ROM: 2896).
  - min_line_length_pck			6008
  - min_line_length_pck_bin		3010
  - min_frame_blanking_lines		36

